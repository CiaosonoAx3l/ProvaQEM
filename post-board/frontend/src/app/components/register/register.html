<div class="login-page">
  <div class="login-card">

    <!-- Logo in alto -->
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
          <line x1="8" x2="16" y1="9" y2="9"/>
          <line x1="8" x2="16" y1="13" y2="13"/>
          <line x1="8" x2="12" y1="17" y2="17"/>
        </svg>
      </div>
      <span class="login-logo-text">Post Board</span>
    </div>

    <h2>Crea un Account</h2>
    <p class="login-subtitle">Inserisci i tuoi dati per registrarti.</p>

    <!-- Box Errore stile Login -->
    <div *ngIf="errorMessage" class="error-box" role="alert">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="error-icon">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <line x1="12" x2="12" y1="9" y2="13"/>
        <line x1="12" x2="12.01" y1="17" y2="17"/>
      </svg>
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form (ngSubmit)="onSubmit()" novalidate>
      <div class="form-group">
        <label for="username">Username</label>
        <input
          type="text"
          id="username"
          name="username"
          [(ngModel)]="user.username"
          placeholder="Scegli un username"
          autocomplete="off"
          required>
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="user.email"
          placeholder="La tua email"
          autocomplete="email"
          required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="user.password"
          placeholder="Crea una password sicura"
          autocomplete="new-password"
          required>
      </div>

      <button type="submit" class="btn-submit" [disabled]="isInvalid || isSubmitting">
        {{ isSubmitting ? 'Registrazione...' : 'Registrati' }}
      </button>
    </form>

    <div class="login-footer">
      Hai già un account? <a routerLink="/login">Accedi qui</a>
    </div>

  </div>
</div>
