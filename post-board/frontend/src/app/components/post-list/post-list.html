<div class="board-page">
  <header class="board-header">
    <div class="board-title">
      <div class="board-title-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect width="18" height="18" x="3" y="3" rx="2"/>
          <line x1="8" x2="16" y1="9" y2="9"/>
          <line x1="8" x2="16" y1="13" y2="13"/>
          <line x1="8" x2="12" y1="17" y2="17"/>
        </svg>
      </div>
      <h2>Bacheca</h2>
    </div>
    <div class="actions">
      <button routerLink="/create" class="btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="12" x2="12" y1="5" y2="19"/>
          <line x1="5" x2="19" y1="12" y2="12"/>
        </svg>
        Nuovo post
      </button>
      <button (click)="logout()" class="btn-ghost">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
          <polyline points="16 17 21 12 16 7"/>
          <line x1="21" x2="9" y1="12" y2="12"/>
        </svg>
        Esci
      </button>
    </div>
  </header>

  @for (post of posts; track $index) {
    <div class="post-card">
      <div class="post-meta">
        <div class="post-author">
          <!--<div class="avatar">{{ (post.authorUsername || '??') | slice:0:2 | uppercase }}</div>-->
          <span class="author-name">@{{ post.authorUsername }}</span>
        </div>
        <span class="post-date">{{ post.createdAt }}</span>
      </div>
      <hr class="post-divider">
      <p class="post-content">{{ post.content }}</p>
    </div>
  } @empty {
    <div class="empty-state">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <p>La bacheca è vuota. Scrivi il primo post.</p>
    </div>
  }

  <div class="pagination">
    <button
      class="btn-page"
      (click)="loadPosts(currentPage - 1)"
      [disabled]="currentPage === 0">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Precedente
    </button>
    <span class="page-info">Pagina {{ currentPage + 1 }} di {{ totalPages || 1 }}</span>
    <button
      class="btn-page"
      (click)="loadPosts(currentPage + 1)"
      [disabled]="currentPage >= totalPages - 1">
      Successiva
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
  </div>
</div>
